plugins {
    id "java"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def minecraftJar = providers.gradleProperty("minecraftJar")
    .orElse(providers.environmentVariable("FOLIUM_MINECRAFT_JAR"))

if (minecraftJar.isPresent()) {
    dependencies {
        compileOnly files(minecraftJar.get())
        compileOnly "org.joml:joml:1.10.9"
        compileOnly "it.unimi.dsi:fastutil:8.5.19"
        compileOnly "org.lwjgl:lwjgl:3.4.3"
    }
} else {
    tasks.withType(JavaCompile).configureEach {
        enabled = false
    }

    tasks.register("explainMinecraftJar") {
        doLast {
            println "render-webgpu requires the local Minecraft 26.3 client JAR."
            println "Use -PminecraftJar=/path/to/minecraft-client-26.3.jar"
            println "or set FOLIUM_MINECRAFT_JAR."
        }
    }
}
