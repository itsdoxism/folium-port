name: Folium WASM smoke

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  wasm-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build Folium WASM-GC smoke target
        run: gradle :runtime-wasm:buildWasmGC --stacktrace

      - name: Verify output
        run: |
          test -f runtime-wasm/build/generated/teavm/wasm-gc/folium-smoke.wasm
          test -f runtime-wasm/build/generated/teavm/wasm-gc/folium-smoke.wasm-runtime.js
          ls -lh runtime-wasm/build/generated/teavm/wasm-gc/

      - name: Upload WASM smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: folium-wasm-smoke
          path: runtime-wasm/build/generated/teavm/wasm-gc/
