<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Folium WebGPU preboot</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #0b0d0c;
            color: #e7ece9;
            font: 15px/1.5 system-ui, sans-serif;
        }

        body {
            display: grid;
            grid-template-rows: 1fr auto;
        }

        #folium-canvas {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0;
            background: #111512;
        }

        #status {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,.1);
        }

        #status[data-ok="true"]::before {
            content: "● ";
        }
    </style>
    <script src="../build/generated/teavm/wasm-gc/folium-smoke.wasm-runtime.js"></script>
</head>
<body>
<canvas id="folium-canvas"></canvas>
<div id="status">Preparing Folium WebGPU host…</div>

<script type="module">
import {
    prepareFoliumGraphics,
    renderFoliumBootstrapFrame
} from "./folium-host.js";

const status = document.getElementById("status");

(async () => {
    try {
        const host = await prepareFoliumGraphics();

        if (host.deviceReady) {
            renderFoliumBootstrapFrame();
            status.textContent = "WebGPU preboot OK · starting Java/WASM…";
            status.dataset.ok = "true";
        } else {
            status.textContent = "WebGPU unavailable · starting Java/WASM for diagnostics…";
            status.dataset.ok = "false";
        }

        const module = await TeaVM.wasmGC.load(
            "../build/generated/teavm/wasm-gc/folium-smoke.wasm"
        );

        module.exports.main([]);
    } catch (error) {
        console.error(error);
        status.textContent = "Folium preboot failed — see console";
        status.dataset.ok = "false";
    }
})();
</script>
</body>
</html>
